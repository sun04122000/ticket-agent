<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ticket Agent Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #e2e8f0; height: 100vh; display: flex; overflow: hidden; }
    .pane { height: 100%; display: flex; flex-direction: column; }
    #history-pane { width: 260px; border-right: 1px solid #1e293b; background-color: #020617; }
    #left-pane { flex: 1; border-right: 1px solid #334155; background-color: #0f172a; }
    #right-pane { flex: 1.2; background-color: #020617; }
    header { padding: 16px; border-bottom: 1px solid #334155; background-color: #020617; display: flex; justify-content: space-between; align-items: center; height: 60px; }
    h1, h2, h3 { font-size: 14px; font-weight: 600; }
    h1 { color: #818cf8; }
    h2 { color: #cbd5e1; }
    h3 { color: #f1f5f9; }
    button#reset { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    button#reset:hover { background-color: #334155; color: #f8fafc; }
    #sessions-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .session-item { padding: 10px 14px; border-radius: 8px; background-color: #0f172a; border: 1px solid #1e293b; cursor: pointer; font-size: 12px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: all 0.2s; }
    .session-item:hover { background-color: #1e293b; border-color: #475569; color: #f1f5f9; }
    .session-item.active { background-color: #312e81; border-color: #4f46e5; color: #e0e7ff; }
    #tickets { flex: 1; overflow-y: auto; padding: 16px; }
    #tickets em, #sessions-list em { color: #64748b; font-style: normal; display: block; text-align: center; margin-top: 20px; font-size: 13px; }
    .ticket { background-color: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; transition: border-color 0.2s; }
    .ticket:hover { border-color: #475569; }
    .ticket-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ticket-head strong { font-family: monospace; color: #94a3b8; font-size: 13px; }
    .ticket-title { font-weight: 600; color: #f1f5f9; font-size: 14px; margin-bottom: 4px; }
    .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .pill.high { background-color: #7f1d1d; color: #fca5a5; }
    .pill.medium { background-color: #78350f; color: #fde047; }
    .pill.low { background-color: #14532d; color: #86efac; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 80%; padding: 12px 16px; font-size: 14px; line-height: 1.5; position: relative; }
    .msg.user { align-self: flex-end; background-color: #4f46e5; color: #ffffff; border-radius: 16px 16px 0 16px; }
    .msg.bot { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 16px 16px 16px 0; }
    .tag { display: block; font-size: 11px; color: #818cf8; margin-top: 6px; font-family: monospace; background: rgba(129, 140, 248, 0.1); padding: 2px 6px; border-radius: 4px; width: fit-content; }
    form { padding: 16px; background-color: #020617; border-top: 1px solid #334155; display: flex; gap: 10px; }
    input { flex: 1; background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 12px 16px; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #6366f1; }
    button#send { background-color: #4f46e5; color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    button#send:hover { background-color: #4338ca; }
    button#send:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="history-pane" class="pane"><header><h3>🕒 History</h3></header><div id="sessions-list"><em>No history yet</em></div></div>
  <div id="left-pane" class="pane"><header><h1>🎫 Ticket Workspace</h1></header><div id="tickets"><em>No tickets yet</em></div></div>
  <div id="right-pane" class="pane"><header><h2>🤖 AI Agent Co-Pilot</h2><button id="reset">New Chat</button></header><div id="messages"></div><form id="form"><input type="text" id="input" placeholder="Describe an issue..." autocomplete="off"><button type="submit" id="send">Send</button></form></div>
  <script>
    const $ = (id) => document.getElementById(id);
    function getUserId() { try { let id = localStorage.getItem("userId"); if (!id) { id = crypto.randomUUID(); localStorage.setItem("userId", id); } return id; } catch { return crypto.randomUUID(); } }
    const userId = getUserId(); let sessionId = crypto.randomUUID(); let allTickets = [];
    function addMessage(text, who, intent) {
      const div = document.createElement("div");
      let roleClass = "bot"; if (who === "user") { roleClass = "user"; } else if (who === "bot" || who === "assistant") { roleClass = "bot"; }
      div.className = "msg " + roleClass; div.textContent = text;
      if (intent) { const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "intent: " + intent; div.appendChild(tag); }
      $("messages").appendChild(div); $("messages").scrollTop = $("messages").scrollHeight;
    }
    function renderTickets(tickets) {
      allTickets = tickets; const box = $("tickets"); box.innerHTML = ""; if (!tickets.length) { box.innerHTML = "<em>No tickets yet</em>"; return; }
      for (const t of [...tickets].reverse()) {
        const d = document.createElement("div"); d.className = "ticket";
        const head = document.createElement("div"); head.className = "ticket-head";
        const b = document.createElement("strong"); b.textContent = t.id + " ";
        const pill = document.createElement("span"); pill.className = "pill " + t.priority.toLowerCase(); pill.textContent = t.priority;
        head.append(b, pill);
        const title = document.createElement("div"); title.className = "ticket-title"; title.textContent = t.title;
        const sum = document.createElement("div"); sum.style.color = "#94a3b8"; sum.style.fontSize = "13px"; sum.textContent = t.summary;
        const origin = document.createElement("div"); origin.style.cssText = "font-size:11px;color:#64748b;margin-top:8px;border-top:1px solid #1e293b;padding-top:6px;";
        origin.textContent = t.conversationId === sessionId ? "✨ this conversation" : "⏳ earlier conversation";
        d.append(head, title, sum, origin); box.appendChild(d);
      }
    }
    function renderSessionsList(sessions) {
      const container = $("sessions-list"); container.innerHTML = ""; if (!sessions || !sessions.length) { container.innerHTML = "<em>No history yet</em>"; return; }
      for (const s of [...sessions].reverse()) {
        const d = document.createElement("div"); d.className = "session-item"; if (s.id === sessionId) d.classList.add("active");
        d.textContent = s.title || s.id; d.title = "View conversation for " + s.id;
        d.addEventListener("click", () => { document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active')); d.classList.add("active"); loadOlderConversation(s.id); });
        container.appendChild(d);
      }
    }
    async function loadOlderConversation(targetSessionId) {
      try {
        sessionId = targetSessionId; $("messages").innerHTML = "";
        const res = await fetch("/history/view?sessionId=" + encodeURIComponent(targetSessionId));
        if (res.ok) {
          const data = await res.json();
          if (data.history && data.history.length) { data.history.forEach(msg => { addMessage(msg.content || msg.text || "", msg.role); }); }
          renderTickets(allTickets);
        }
      } catch (err) { addMessage("Failed to pull conversation: " + err.message, "bot"); }
    }
    async function loadTickets() { try { const res = await fetch("/tickets?userId=" + encodeURIComponent(userId)); if (res.ok) renderTickets(await res.json()); } catch {} }
    async function loadSessionsHistory() { try { const res = await fetch("/history?userId=" + encodeURIComponent(userId)); if (res.ok) { const data = await res.json(); renderSessionsList(data.sessions); } } catch {} }
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault(); const message = $("input").value.trim(); if (!message) return; $("input").value = ""; addMessage(message, "user"); $("send").disabled = true;
      try {
        const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ userId, sessionId, message }), });
        if (!res.ok) throw new Error("HTTP " + res.status); const data = await res.json();
        addMessage(data.reply, "bot", data.intent); renderTickets(data.tickets); loadSessionsHistory();
      } catch (err) { addMessage("Something went wrong: " + err.message, "bot"); } finally { $("send").disabled = false; $("input").focus(); }
    });
    $("reset").addEventListener("click", () => { sessionId = crypto.randomUUID(); $("messages").innerHTML = ""; renderTickets(allTickets); loadSessionsHistory(); addMessage("New conversation started. How can I help?", "bot"); });
    addMessage("Hi! Ask me a question or tell me about a problem you're having.", "bot"); loadTickets(); loadSessionsHistory();
  </script>
</body>
</html>
